# Nginx config for Telegram Desktop update server
# Domain: cdn.honeydrinksomewine.com
# Web root: /home/update/www

server {
    listen 443 ssl http2;
    server_name cdn.honeydrinksomewine.com;

    ssl_certificate     /etc/letsencrypt/live/cdn.honeydrinksomewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdn.honeydrinksomewine.com/privkey.pem;

    root /home/update/www;

    # JSON endpoint for version check: GET /current4
    location = /current4 {
        default_type application/json;
        try_files /current4 =404;
    }

    # Update files: GET /files/tx64upd{N}
    location /files/ {
        alias /home/update/www/files/;
        add_header Cache-Control "public, max-age=86400";
    }

    access_log /var/log/nginx/cdn-update-access.log;
    error_log  /var/log/nginx/cdn-update-error.log;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name cdn.honeydrinksomewine.com;
    return 301 https://$host$request_uri;
}
